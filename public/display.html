<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>搶答燈 — 投影端</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ── Binance-derived design tokens ── */
:root{
  --canvas:#0b0e11; --surface:#1e2329; --surface2:#2b3139;
  --primary:#fcd535; --primary-active:#f0b90b; --on-primary:#181a20;
  --body:#eaecef; --muted:#707a8a; --muted-strong:#929aa5;
  --hairline:#2b3139; --up:#0ecb81; --down:#f6465d;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%; overflow: hidden;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--canvas);
  color: var(--body);
  -webkit-font-smoothing: antialiased;
}
.num { font-variant-numeric: tabular-nums; }

/* ── Screens ── */
.screen { display: none; flex-direction: column; height: 100%; width: 100%; }
.screen.active { display: flex; }

/* ── Idle ── */
#idle-screen { align-items: center; justify-content: center; gap: 28px; padding: 48px; }
.idle-logo-badge {
  display: inline-flex; align-items: center; justify-content: center;
  width: clamp(96px, 12vw, 150px); height: clamp(96px, 12vw, 150px);
  border-radius: clamp(20px, 2.6vw, 30px);
  background: var(--primary);
  box-shadow: 0 clamp(10px,1.6vw,22px) clamp(30px,5vw,70px) rgba(252,213,53,0.28);
}
.idle-logo { font-size: clamp(40px, 6vw, 72px); font-weight: 900; color: var(--on-primary); letter-spacing: -2px; }
.idle-title { font-size: clamp(30px, 5vw, 62px); font-weight: 800; color: #fff; letter-spacing: 2px; }
.idle-sub { font-size: clamp(12px, 1.6vw, 18px); letter-spacing: 6px; color: var(--muted); text-transform: uppercase; margin-top: -14px; }

/* Joined-teams panel (需求1) */
.joined-panel {
  width: min(86vw, 1100px);
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: 12px;
  padding: clamp(18px, 2.4vw, 28px) clamp(20px, 3vw, 36px);
  display: flex; flex-direction: column; gap: 16px;
}
.joined-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
.joined-label { font-size: clamp(13px,1.5vw,17px); font-weight: 700; letter-spacing: 4px; color: var(--muted-strong); text-transform: uppercase; }
.joined-count { font-size: clamp(18px,2.4vw,30px); font-weight: 800; color: var(--primary); }
.joined-count small { color: var(--muted); font-size: 0.5em; font-weight: 600; letter-spacing: 2px; margin-left: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: clamp(8px,1vw,12px); }
.chip {
  font-size: clamp(15px, 1.8vw, 22px); font-weight: 700; color: var(--body);
  background: var(--surface2); border-radius: 8px;
  padding: clamp(8px,1vw,12px) clamp(14px,1.6vw,20px);
  animation: chip-in 0.25s ease-out both;
}
.chips-empty { font-size: clamp(15px,1.8vw,20px); color: var(--muted); letter-spacing: 2px; }
@keyframes chip-in { from{opacity:0; transform:translateY(6px) scale(0.96);} to{opacity:1; transform:none;} }
.idle-standby { font-size: clamp(11px,1.3vw,15px); letter-spacing: 7px; color: var(--muted); text-transform: uppercase; animation: blink-soft 2.6s ease-in-out infinite; }
@keyframes blink-soft { 0%,100%{opacity:0.35;} 50%{opacity:0.85;} }

/* ── Open (需求2: 倒數移到角落，中間即時順位) ── */
#open-screen { padding: clamp(24px,3vw,40px) clamp(32px,4vw,64px); }
.open-top {
  display: flex; align-items: center; justify-content: space-between;
  gap: 20px; flex-shrink: 0; margin-bottom: clamp(16px,2vw,28px);
}
.open-status {
  display: flex; align-items: center; gap: 14px;
  font-size: clamp(20px,2.6vw,36px); font-weight: 800; letter-spacing: 4px;
  color: var(--primary); text-transform: uppercase;
}
.live-dot {
  width: clamp(12px,1.3vw,16px); height: clamp(12px,1.3vw,16px); border-radius: 50%;
  background: var(--primary); box-shadow: 0 0 0 0 rgba(252,213,53,0.6);
  animation: live-pulse 1.2s ease-out infinite;
}
@keyframes live-pulse { 0%{box-shadow:0 0 0 0 rgba(252,213,53,0.5);} 100%{box-shadow:0 0 0 16px rgba(252,213,53,0);} }
/* 角落倒數計時 */
.count-badge {
  display: flex; align-items: center; gap: 12px;
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: 12px; padding: clamp(8px,1vw,12px) clamp(16px,1.8vw,24px);
}
.count-badge .cb-label { font-size: clamp(10px,1.1vw,13px); font-weight: 700; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; }
#count-badge-num { font-size: clamp(30px,3.6vw,52px); font-weight: 800; color: #fff; line-height: 1; }
.count-badge.low #count-badge-num { color: var(--down); }

.open-body { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.open-waiting {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; text-align: center;
}
.open-waiting-title { font-size: clamp(28px,4vw,56px); font-weight: 800; color: #fff; letter-spacing: 3px; }
.open-waiting-sub { font-size: clamp(14px,1.8vw,22px); color: var(--muted); letter-spacing: 4px; text-transform: uppercase; }
.open-waiting .chips { justify-content: center; max-width: 80vw; }

/* ── Live order list (共用樣式：open 即時 + rank 回顧) ── */
.order-list { list-style: none; width: 100%; flex: 1; display: flex; flex-direction: column; gap: clamp(8px,1.2vw,14px); overflow-y: auto; }
.rank-row {
  display: flex; align-items: center; gap: clamp(16px,2.2vw,28px);
  border-radius: 12px; padding: clamp(14px,2vw,24px) clamp(20px,2.6vw,34px);
  background: var(--surface); border: 1px solid var(--hairline);
  border-left: 4px solid var(--hairline);
  animation: slide-up 0.28s ease-out both; flex-shrink: 0;
  transition: background 0.3s, border-color 0.3s, opacity 0.3s;
}
.order-list > li:nth-child(1).rank-row { border-left-color: var(--primary); background: rgba(252,213,53,0.06); }
.order-list > li:nth-child(2).rank-row { border-left-color: var(--muted-strong); }
.order-list > li:nth-child(3).rank-row { border-left-color: #cd7f32; }
.rank-row.focus { border-color: var(--primary) !important; border-left-color: var(--primary) !important; background: rgba(252,213,53,0.1) !important; }
.rank-row.correct { border-color: var(--up) !important; border-left-color: var(--up) !important; background: rgba(14,203,129,0.08) !important; opacity: 0.7; }
.rank-row.wrong { border-color: var(--down) !important; border-left-color: var(--down) !important; background: rgba(246,70,93,0.06) !important; opacity: 0.45; }
.rank-row.just-buzzed { animation: just-buzzed 0.5s ease-out; }
@keyframes slide-up { from{opacity:0; transform:translateY(20px);} to{opacity:1; transform:none;} }
@keyframes just-buzzed { 0%{transform:scale(1);} 30%{transform:scale(1.025); border-color:var(--primary);} 100%{transform:scale(1);} }

.rank-num {
  width: clamp(44px,5.5vw,64px); height: clamp(44px,5.5vw,64px); border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: clamp(16px,2vw,26px); font-weight: 800; flex-shrink: 0;
  background: var(--surface2); color: var(--muted-strong); font-variant-numeric: tabular-nums;
}
.rank-num.r1 { background: var(--primary); color: var(--on-primary); }
.rank-num.r2 { background: #c2cad6; color: #1e2329; }
.rank-num.r3 { background: #cd7f32; color: #1a0d00; }
.rank-team { flex: 1; font-size: clamp(26px,4vw,52px); font-weight: 800; color: #fff; letter-spacing: 1px; }
.rank-row.focus .rank-team { color: var(--primary); }
.rank-row.correct .rank-team { color: var(--up); text-decoration: line-through; }
.rank-row.wrong .rank-team { color: var(--down); text-decoration: line-through; }

.focus-indicator {
  font-size: clamp(12px,1.3vw,16px); font-weight: 800; letter-spacing: 3px; text-transform: uppercase;
  color: var(--primary); padding: 7px 16px; border: 1px solid var(--primary); border-radius: 8px;
  background: rgba(252,213,53,0.08); white-space: nowrap; animation: blink 1s ease-in-out infinite;
}
@keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.35;} }
.result-tag { font-size: clamp(13px,1.4vw,17px); font-weight: 800; letter-spacing: 2px; padding: 8px 18px; border-radius: 8px; text-transform: uppercase; white-space: nowrap; }
.tag-correct { background: rgba(14,203,129,0.18); color: var(--up); }
.tag-wrong { background: rgba(246,70,93,0.18); color: var(--down); }

/* ── Rank recap screen ── */
#rank-screen { padding: clamp(28px,3.4vw,44px) clamp(32px,4vw,64px); }
.rank-title { font-size: clamp(14px,1.7vw,22px); font-weight: 800; letter-spacing: 6px; color: var(--muted-strong); text-transform: uppercase; margin-bottom: clamp(16px,2.4vw,30px); flex-shrink: 0; }

/* ── First-buzz flash ── */
@keyframes flash-boom { 0%{background:#fff;} 12%{background:var(--primary);} 45%{background:#3a2f06;} 100%{background:transparent;} }
body.flash::after {
  content:''; position: fixed; inset: 0; z-index: 5; pointer-events: none;
  animation: flash-boom 0.6s ease-out forwards;
}

/* ── X overlay (wrong) ── */
#x-overlay { display: none; position: fixed; inset: 0; z-index: 30; align-items: center; justify-content: center; pointer-events: none; }
#x-overlay.show { display: flex; }
.x-mark { font-size: clamp(180px,36vw,360px); font-weight: 900; color: var(--down); line-height: 1; }
@keyframes x-stamp { 0%{transform:scale(2.2) rotate(-15deg); opacity:0;} 100%{transform:scale(1) rotate(0); opacity:1;} }
.x-stamp { animation: x-stamp 0.32s cubic-bezier(0.22,0.61,0.36,1) both; }

@media (prefers-reduced-motion: reduce) {
  .rank-row, .chip { animation: none; }
  .focus-indicator, .live-dot { animation: none; opacity: 1; }
  .idle-standby { animation: none; opacity: 1; }
  body.flash::after { animation: none; }
  .x-stamp { animation: none; opacity: 1; transform: none; }
}
</style>
</head>
<body>

<div id="idle-screen" class="screen active">
  <div class="idle-logo-badge"><div class="idle-logo">BZ</div></div>
  <div style="text-align:center">
    <div class="idle-title">搶答燈系統</div>
    <div class="idle-sub">Quiz Buzzer System</div>
  </div>
  <div class="joined-panel">
    <div class="joined-head">
      <span class="joined-label">已進場組別</span>
      <span class="joined-count num"><span id="idle-count">0</span><small>組</small></span>
    </div>
    <div id="idle-chips" class="chips"><span class="chips-empty">等待組別加入…</span></div>
  </div>
  <div class="idle-standby">STANDBY · 等待主持人開始</div>
</div>

<div id="open-screen" class="screen">
  <div class="open-top">
    <div class="open-status"><span class="live-dot"></span>搶答開放中</div>
    <div id="count-badge" class="count-badge">
      <span class="cb-label">倒數</span>
      <span id="count-badge-num" class="num">--</span>
    </div>
  </div>
  <div class="open-body">
    <div id="open-waiting" class="open-waiting">
      <div class="open-waiting-title">搶答開放！</div>
      <div class="open-waiting-sub">按下按鈕搶答</div>
      <div id="open-waiting-chips" class="chips"></div>
    </div>
    <ol id="open-rank-list" class="order-list" style="display:none"></ol>
  </div>
</div>

<div id="rank-screen" class="screen">
  <div class="rank-title">搶答順位</div>
  <ol id="rank-list" class="order-list"></ol>
</div>

<div id="x-overlay"><div id="x-icon" class="x-mark">✕</div></div>

<script>
const $ = id => document.getElementById(id);
const escHtml = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

let ws, audioCtx, countdownInterval = null, lastPhase = 'locked', prevBuzzCount = 0;
const COUNT_FROM = 30;

// ── Audio ──
function getCtx(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); return audioCtx; }
function playBoom(){
  const ctx=getCtx();
  const buf=ctx.createBuffer(1,ctx.sampleRate*0.5,ctx.sampleRate); const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/(ctx.sampleRate*0.05));
  const ns=ctx.createBufferSource(); ns.buffer=buf;
  const ng=ctx.createGain(); ng.gain.setValueAtTime(3,ctx.currentTime); ng.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.5);
  ns.connect(ng); ng.connect(ctx.destination); ns.start();
  const osc=ctx.createOscillator(), og=ctx.createGain();
  osc.type='sine'; osc.frequency.setValueAtTime(80,ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(28,ctx.currentTime+0.45);
  og.gain.setValueAtTime(2,ctx.currentTime); og.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.65);
  osc.connect(og); og.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime+0.65);
}
function playTick(){
  const ctx=getCtx(); const o=ctx.createOscillator(), g=ctx.createGain();
  o.type='square'; o.frequency.value=1200; g.gain.setValueAtTime(0.12,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.08);
  o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+0.1);
}
function playCorrect(){
  const ctx=getCtx();
  [523,659,784,1047].forEach((f,i)=>{ const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='triangle'; o.frequency.value=f;
    g.gain.setValueAtTime(0.45,ctx.currentTime+i*0.1); g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+i*0.1+0.35);
    o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime+i*0.1); o.stop(ctx.currentTime+i*0.1+0.35); });
}
function playWrong(){
  const ctx=getCtx(); const o=ctx.createOscillator(),g=ctx.createGain();
  o.type='sawtooth'; o.frequency.setValueAtTime(220,ctx.currentTime); o.frequency.linearRampToValueAtTime(100,ctx.currentTime+1.3);
  g.gain.setValueAtTime(0.6,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+1.3);
  o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+1.3);
}
function playOpenBeep(){
  const ctx=getCtx();
  [0,0.32,0.64,0.88].forEach(t=>{ const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='square'; o.frequency.value=t===0.88?1200:880; const dur=t===0.88?0.45:0.16;
    g.gain.setValueAtTime(0.26,ctx.currentTime+t); g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+t+dur);
    o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+dur+0.05); });
}

function fireConfetti(){
  confetti({ particleCount:120, spread:65, angle:60, origin:{x:0,y:0.5}, colors:['#fcd535','#f0b90b','#fff'] });
  confetti({ particleCount:120, spread:65, angle:120, origin:{x:1,y:0.5}, colors:['#fcd535','#f0b90b','#fff'] });
  setTimeout(()=>confetti({ particleCount:80, spread:100, origin:{y:0.3}, colors:['#fcd535','#0ecb81','#fff'] }),350);
}

function showScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  const el=$(`${name}-screen`); if(el) el.classList.add('active');
}

// ── Countdown (角落 badge) ──
function startCountdown(){
  clearInterval(countdownInterval); countdownInterval=null;
  let s=COUNT_FROM;
  const badge=$('count-badge'), numEl=$('count-badge-num');
  numEl.textContent=s; badge.classList.remove('low');
  countdownInterval=setInterval(()=>{
    s--; numEl.textContent=Math.max(s,0);
    if(s<=5 && s>0){ badge.classList.add('low'); playTick(); }
    if(s<=0){ clearInterval(countdownInterval); countdownInterval=null; }
  },1000);
}

// ── Chips (進場名單) ──
function renderChips(container, teams){
  container.innerHTML='';
  if(!teams || teams.length===0){ container.innerHTML='<span class="chips-empty">等待組別加入…</span>'; return; }
  teams.forEach(t=>{ const s=document.createElement('span'); s.className='chip'; s.textContent=t; container.appendChild(s); });
}

// ── Order list (open 即時 + rank 回顧共用) ──
function renderOrderList(listEl, buzzOrder, currentFocus, highlightNew){
  listEl.innerHTML='';
  const numLabels=['1','2','3'];
  buzzOrder.forEach((entry,i)=>{
    const isFocus = currentFocus===entry.team && !entry.verified;
    const rowCls = entry.verified ? (entry.result==='correct'?'correct':'wrong') : (isFocus?'focus':'');
    const li=document.createElement('li');
    li.className=`rank-row ${rowCls}`;
    li.style.animationDelay=`${Math.min(i,8)*0.05}s`;
    if(highlightNew && i===buzzOrder.length-1 && !entry.verified) li.classList.add('just-buzzed');
    let badge='';
    if(entry.verified){
      badge = entry.result==='correct'
        ? '<span class="result-tag tag-correct">正確</span>'
        : '<span class="result-tag tag-wrong">錯誤</span>';
    } else if(isFocus){ badge='<span class="focus-indicator">待驗證</span>'; }
    const numCls = i<3 ? `r${i+1}` : '';
    li.innerHTML=`
      <div class="rank-num ${numCls} num">${numLabels[i]??(i+1)}</div>
      <span class="rank-team">${escHtml(entry.team)}</span>
      ${badge}`;
    listEl.appendChild(li);
  });
}

// ── State ──
function applyState(state){
  const teams = state.joinedTeams || [];
  if(state.phase==='open'){
    showScreen('open');
    if(!countdownInterval && lastPhase!=='open') startCountdown();
    const hasBuzz = state.buzzOrder.length>0;
    $('open-waiting').style.display = hasBuzz ? 'none' : 'flex';
    $('open-rank-list').style.display = hasBuzz ? 'flex' : 'none';
    if(hasBuzz){
      renderOrderList($('open-rank-list'), state.buzzOrder, state.currentFocus, state.buzzOrder.length>prevBuzzCount);
    } else {
      renderChips($('open-waiting-chips'), teams);
    }
  } else if(state.phase==='reviewing'){
    clearInterval(countdownInterval); countdownInterval=null;
    showScreen('rank');
    renderOrderList($('rank-list'), state.buzzOrder, state.currentFocus, false);
  } else { // locked
    clearInterval(countdownInterval); countdownInterval=null;
    $('x-overlay').classList.remove('show');
    if(state.buzzOrder.length){
      showScreen('rank');
      renderOrderList($('rank-list'), state.buzzOrder, state.currentFocus, false);
    } else {
      showScreen('idle');
      $('idle-count').textContent = teams.length;
      renderChips($('idle-chips'), teams);
    }
  }
  prevBuzzCount = state.buzzOrder.length;
}

function handleMessage(msg){
  switch(msg.type){
    case 'state':
      if(lastPhase!=='open' && msg.phase==='open'){ playOpenBeep(); startCountdown(); }
      lastPhase=msg.phase;
      applyState(msg);
      break;
    case 'first_buzz':
      clearInterval(countdownInterval); countdownInterval=null;
      document.body.classList.add('flash');
      setTimeout(()=>document.body.classList.remove('flash'),600);
      playBoom();
      break;
    case 'verify_result':
      if(msg.result==='correct'){ playCorrect(); fireConfetti(); }
      else {
        playWrong();
        const overlay=$('x-overlay'), icon=$('x-icon');
        icon.classList.remove('x-stamp'); void icon.offsetWidth; icon.classList.add('x-stamp');
        overlay.classList.add('show');
        setTimeout(()=>overlay.classList.remove('show'),1800);
      }
      break;
  }
}

function connect(){
  ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}`);
  ws.addEventListener('message', e=>handleMessage(JSON.parse(e.data)));
  ws.addEventListener('close', ()=>setTimeout(connect,2000));
}

document.addEventListener('click', ()=>getCtx(), { once:true });
document.addEventListener('keydown', ()=>getCtx(), { once:true });
connect();
</script>
</body>
</html>
