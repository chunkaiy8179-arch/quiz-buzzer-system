<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>搶答燈 — 投影端</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%; overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
  background: #0a0a0a;
  color: #fff;
}

/* ── Screens ── */
.screen { display: none; flex-direction: column; align-items: center; justify-content: center; height: 100%; width: 100%; }
.screen.active { display: flex; }

/* ── Idle ── */
#idle-screen {
  gap: 24px;
  text-align: center;
}
.idle-logo {
  font-size: clamp(80px, 18vw, 160px);
  font-weight: 900;
  color: #e11d48;
  letter-spacing: -8px;
  line-height: 1;
}
.idle-title {
  font-size: clamp(28px, 5vw, 56px);
  font-weight: 900;
  letter-spacing: 10px;
  color: #e5e5e5;
  text-transform: uppercase;
}
.idle-sub {
  font-size: clamp(14px, 2vw, 22px);
  letter-spacing: 6px;
  color: #333;
  text-transform: uppercase;
}
.idle-bar {
  width: 60px; height: 3px;
  background: #e11d48;
  border-radius: 2px;
  margin-top: 8px;
}

/* ── Open ── */
#open-screen { gap: 32px; }
.open-label {
  font-size: clamp(18px, 3vw, 32px);
  font-weight: 800;
  letter-spacing: 8px;
  color: #4ade80;
  text-transform: uppercase;
}
#countdown {
  font-size: clamp(140px, 30vw, 280px);
  font-weight: 900;
  line-height: 1;
  color: #fff;
  font-variant-numeric: tabular-nums;
  animation: count-glow 1s ease-in-out infinite;
}
@keyframes count-glow {
  0%,100% { text-shadow: 0 0 40px rgba(255,255,255,0.15); }
  50%     { text-shadow: 0 0 80px rgba(255,255,255,0.4), 0 0 120px rgba(255,255,255,0.2); }
}
.open-hint {
  font-size: clamp(16px, 2.5vw, 28px);
  letter-spacing: 4px;
  color: #444;
  text-transform: uppercase;
}

/* ── First Popup ── */
#first-popup {
  display: none;
  position: fixed; inset: 0; z-index: 20;
  flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  pointer-events: none;
}
#first-popup.show { display: flex; }
.first-rank-label {
  font-size: clamp(16px, 2.5vw, 28px);
  font-weight: 800;
  letter-spacing: 8px;
  color: #fbbf24;
  text-transform: uppercase;
  margin-bottom: 16px;
}
#first-team-name {
  font-size: clamp(60px, 14vw, 140px);
  font-weight: 900;
  color: #fde047;
  line-height: 1.1;
  padding: 0 40px;
}
.first-sub {
  font-size: clamp(22px, 4vw, 48px);
  font-weight: 800;
  letter-spacing: 6px;
  color: #fff;
  text-transform: uppercase;
  margin-top: 16px;
}

@keyframes pop-in {
  0%   { transform: scale(0.2) translateY(80px); opacity: 0; }
  65%  { transform: scale(1.1) translateY(-12px); opacity: 1; }
  100% { transform: scale(1) translateY(0); opacity: 1; }
}
.pop-in { animation: pop-in 0.5s cubic-bezier(0.34,1.56,0.64,1) both; }

/* ── Rank Screen ── */
#rank-screen {
  gap: 28px;
  padding: 40px;
  width: 100%;
  max-width: 900px;
  margin: 0 auto;
}
.rank-title {
  font-size: clamp(20px, 3vw, 36px);
  font-weight: 800;
  letter-spacing: 8px;
  color: #444;
  text-transform: uppercase;
  align-self: flex-start;
}
#rank-list { list-style: none; width: 100%; display: flex; flex-direction: column; gap: 14px; }

.rank-row {
  display: flex;
  align-items: center;
  gap: 20px;
  border-radius: 18px;
  padding: 20px 28px;
  background: #111;
  border: 1px solid #1f1f1f;
  animation: slide-up 0.3s ease-out both;
  transition: background 0.3s, border-color 0.3s;
}
.rank-row.focus {
  background: rgba(234,179,8,0.1);
  border-color: #ca8a04;
}
.rank-row.correct { background: rgba(22,163,74,0.08); border-color: #15803d; opacity: 0.6; }
.rank-row.wrong   { background: rgba(220,38,38,0.06); border-color: #7f1d1d; opacity: 0.4; }

@keyframes slide-up {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}

.rank-num {
  width: 52px; height: 52px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 900;
  flex-shrink: 0;
  letter-spacing: 0;
}
.r1 { background: #854d0e; color: #fef08a; }
.r2 { background: #374151; color: #d1d5db; }
.r3 { background: #431407; color: #fdba74; }
.rn { background: #1a1a1a; color: #555; font-size: 13px; }

.rank-team {
  flex: 1;
  font-size: clamp(24px, 4vw, 48px);
  font-weight: 800;
  color: #e5e5e5;
  letter-spacing: 2px;
}
.rank-row.focus .rank-team { color: #fde047; }
.rank-row.correct .rank-team { color: #4ade80; text-decoration: line-through; }
.rank-row.wrong   .rank-team { color: #f87171; text-decoration: line-through; }

.focus-indicator {
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 3px;
  color: #fbbf24;
  text-transform: uppercase;
  padding: 6px 14px;
  border: 1px solid #854d0e;
  border-radius: 8px;
  animation: blink 1s ease-in-out infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

.result-tag {
  font-size: 14px;
  font-weight: 800;
  letter-spacing: 2px;
  padding: 7px 16px;
  border-radius: 8px;
  text-transform: uppercase;
}
.tag-correct { background: rgba(22,163,74,0.2); color: #4ade80; }
.tag-wrong   { background: rgba(220,38,38,0.2); color: #f87171; }

/* ── Flash ── */
@keyframes flash-boom {
  0%   { background-color: #fff; }
  12%  { background-color: #e11d48; }
  40%  { background-color: #7f1d1d; }
  100% { background-color: #0a0a0a; }
}
body.flash { animation: flash-boom 0.7s ease-out forwards; }

/* ── X Overlay ── */
#x-overlay {
  display: none;
  position: fixed; inset: 0; z-index: 30;
  align-items: center; justify-content: center;
  pointer-events: none;
}
#x-overlay.show { display: flex; }
.x-mark {
  font-size: clamp(200px, 40vw, 400px);
  font-weight: 900;
  color: #dc2626;
  line-height: 1;
  text-shadow: 0 0 120px rgba(220,38,38,0.8);
}
@keyframes x-stamp {
  0%   { transform: scale(2.5) rotate(-20deg); opacity: 0; }
  55%  { transform: scale(0.88) rotate(4deg); opacity: 1; }
  100% { transform: scale(1) rotate(0deg); opacity: 1; }
}
.x-stamp { animation: x-stamp 0.4s cubic-bezier(0.34,1.56,0.64,1) both; }
</style>
</head>
<body>

<div id="idle-screen" class="screen active">
  <div class="idle-logo">BZ</div>
  <div class="idle-title">搶答燈系統</div>
  <div class="idle-sub">Quiz Buzzer System</div>
  <div class="idle-bar"></div>
</div>

<div id="open-screen" class="screen">
  <div class="open-label">搶答開放中</div>
  <div id="countdown">--</div>
  <div class="open-hint">BUZZING NOW</div>
</div>

<div id="first-popup">
  <div class="first-rank-label">FIRST BUZZ</div>
  <div id="first-team-name"></div>
  <div class="first-sub">搶到了！</div>
</div>

<div id="rank-screen" class="screen">
  <div class="rank-title">搶答順位</div>
  <ol id="rank-list"></ol>
</div>

<div id="x-overlay">
  <div id="x-icon" class="x-mark">X</div>
</div>

<script>
const $ = id => document.getElementById(id);
const escHtml = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

let ws, audioCtx, countdownInterval = null, lastPhase = 'locked';

// ── Audio ─────────────────────────────────────────────────────────────────
function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playBoom() {
  const ctx = getCtx();
  const buf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random()*2-1) * Math.exp(-i/(ctx.sampleRate*0.05));
  const ns = ctx.createBufferSource(); ns.buffer = buf;
  const ng = ctx.createGain(); ng.gain.setValueAtTime(3, ctx.currentTime); ng.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.5);
  ns.connect(ng); ng.connect(ctx.destination); ns.start();
  const osc = ctx.createOscillator(), og = ctx.createGain();
  osc.type = 'sine'; osc.frequency.setValueAtTime(80, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(28, ctx.currentTime+0.45);
  og.gain.setValueAtTime(2, ctx.currentTime); og.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.65);
  osc.connect(og); og.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime+0.65);
}

function playCorrect() {
  const ctx = getCtx();
  [523,659,784,1047].forEach((f,i) => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'triangle'; o.frequency.value = f;
    g.gain.setValueAtTime(0.45, ctx.currentTime+i*0.1); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+i*0.1+0.35);
    o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime+i*0.1); o.stop(ctx.currentTime+i*0.1+0.35);
  });
}

function playWrong() {
  const ctx = getCtx();
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = 'sawtooth'; o.frequency.setValueAtTime(220, ctx.currentTime); o.frequency.linearRampToValueAtTime(100, ctx.currentTime+1.3);
  g.gain.setValueAtTime(0.65, ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+1.3);
  o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+1.3);
}

function playOpenBeep() {
  const ctx = getCtx();
  [0,0.32,0.64,0.88].forEach(t => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'square'; o.frequency.value = t===0.88 ? 1200 : 880;
    const dur = t===0.88 ? 0.45 : 0.16;
    g.gain.setValueAtTime(0.28, ctx.currentTime+t); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+t+dur);
    o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+dur+0.05);
  });
}

// ── Confetti ──────────────────────────────────────────────────────────────
function fireConfetti() {
  confetti({ particleCount:100, spread:65, angle:60, origin:{x:0,y:0.5} });
  confetti({ particleCount:100, spread:65, angle:120, origin:{x:1,y:0.5} });
  setTimeout(() => confetti({ particleCount:70, spread:90, origin:{y:0.3}, colors:['#ffd700','#ff6b6b','#4ecdc4','#fff'] }), 350);
}

// ── Screens ───────────────────────────────────────────────────────────────
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const el = $(`${name}-screen`);
  if (el) el.classList.add('active');
}

function startCountdown() {
  clearInterval(countdownInterval); countdownInterval = null;
  let s = 30;
  $('countdown').textContent = s;
  countdownInterval = setInterval(() => {
    s--; $('countdown').textContent = s;
    if (s <= 0) { clearInterval(countdownInterval); countdownInterval = null; }
  }, 1000);
}

// ── Rank List ─────────────────────────────────────────────────────────────
function renderRankList(buzzOrder, currentFocus) {
  const list = $('rank-list');
  list.innerHTML = '';
  const numCls = ['r1','r2','r3'];
  const numLabels = ['1ST','2ND','3RD'];
  buzzOrder.forEach((entry, i) => {
    const isFocus = currentFocus === entry.team && !entry.verified;
    const rowCls = entry.verified
      ? (entry.result === 'correct' ? 'correct' : 'wrong')
      : (isFocus ? 'focus' : '');
    const li = document.createElement('li');
    li.className = `rank-row ${rowCls}`;
    li.style.animationDelay = `${i*0.06}s`;

    let badge = '';
    if (entry.verified) {
      badge = entry.result === 'correct'
        ? '<span class="result-tag tag-correct">正確</span>'
        : '<span class="result-tag tag-wrong">錯誤</span>';
    } else if (isFocus) {
      badge = '<span class="focus-indicator">待驗證</span>';
    }

    li.innerHTML = `
      <div class="rank-num ${numCls[i]??'rn'}">${numLabels[i]??`#${i+1}`}</div>
      <span class="rank-team">${escHtml(entry.team)}</span>
      ${badge}
    `;
    list.appendChild(li);
  });
}

// ── State ─────────────────────────────────────────────────────────────────
function applyState(state) {
  if (state.phase === 'locked') {
    clearInterval(countdownInterval); countdownInterval = null;
    $('first-popup').classList.remove('show');
    $('x-overlay').classList.remove('show');
    showScreen(state.buzzOrder.length ? 'rank' : 'idle');
    if (state.buzzOrder.length) renderRankList(state.buzzOrder, state.currentFocus);
  } else if (state.phase === 'open') {
    showScreen('open');
    if (!countdownInterval) startCountdown();
    if (state.buzzOrder.length) renderRankList(state.buzzOrder, state.currentFocus);
  } else if (state.phase === 'reviewing') {
    showScreen('rank');
    renderRankList(state.buzzOrder, state.currentFocus);
  }
}

// ── Message Handling ───────────────────────────────────────────────────────
function handleMessage(msg) {
  switch (msg.type) {
    case 'state':
      if (lastPhase !== 'open' && msg.phase === 'open') {
        playOpenBeep();
        startCountdown();
      }
      lastPhase = msg.phase;
      applyState(msg);
      break;
    case 'first_buzz': {
      clearInterval(countdownInterval); countdownInterval = null;
      document.body.classList.add('flash');
      setTimeout(() => document.body.classList.remove('flash'), 700);
      playBoom();
      const popup = $('first-popup');
      const nameEl = $('first-team-name');
      nameEl.textContent = msg.team;
      nameEl.classList.remove('pop-in');
      void nameEl.offsetWidth;
      nameEl.classList.add('pop-in');
      popup.classList.add('show');
      setTimeout(() => {
        popup.classList.remove('show');
        showScreen('rank');
      }, 2400);
      break;
    }
    case 'verify_result':
      if (msg.result === 'correct') {
        playCorrect();
        fireConfetti();
      } else {
        playWrong();
        const overlay = $('x-overlay');
        const icon = $('x-icon');
        icon.classList.remove('x-stamp');
        void icon.offsetWidth;
        icon.classList.add('x-stamp');
        overlay.classList.add('show');
        setTimeout(() => overlay.classList.remove('show'), 1800);
      }
      break;
  }
}

// ── WebSocket ─────────────────────────────────────────────────────────────
function connect() {
  ws = new WebSocket(`ws://${location.host}`);
  ws.addEventListener('message', e => handleMessage(JSON.parse(e.data)));
  ws.addEventListener('close', () => setTimeout(connect, 2000));
}

document.addEventListener('click', () => getCtx(), { once: true });
document.addEventListener('keydown', () => getCtx(), { once: true });
connect();
</script>
</body>
</html>
