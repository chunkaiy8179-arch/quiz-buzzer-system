<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>聖火之夜 — 學員端</title>
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#d4af37; --gold-bright:#f5d77a; --gold-dim:#a67c2e; --gold-deep:#6f4f1c;
  --flame-red:#e8431f; --flame-amber:#f5a623;
  --ink:#f3ecd9; --muted:#a99a76; --line:rgba(212,175,55,.28);
  --up:#3fae6b; --wrong:#c0392b;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%; overflow: hidden;
  font-family: 'Noto Sans TC', -apple-system, 'Segoe UI', sans-serif;
  color: var(--ink);
  background:
    radial-gradient(ellipse 80% 40% at 50% -5%, #233063 0%, transparent 60%),
    radial-gradient(ellipse 90% 45% at 50% 108%, #46163a 0%, transparent 60%),
    linear-gradient(165deg, #0a1430 0%, #160e2c 52%, #261031 100%);
  -webkit-tap-highlight-color: transparent; user-select: none;
  -webkit-font-smoothing: antialiased;
}
.serif { font-family: 'Noto Serif TC', serif; }

/* ── 登入 / 選城鎮 ── */
#login-screen { display: flex; flex-direction: column; align-items: center; height: 100%; padding: 26px 22px 24px; gap: 14px; overflow-y: auto; }
.login-emblem { filter: drop-shadow(0 0 20px rgba(245,166,35,.4)); margin-top: 4px; }
.login-title { font-size: 28px; font-weight: 900; letter-spacing: 8px; color: var(--gold-bright); text-shadow: 0 0 24px rgba(245,166,35,.3); }
.login-sub { font-size: 12px; color: var(--muted); letter-spacing: 4px; }
.pick-label { font-size: 14px; color: var(--gold-bright); letter-spacing: 4px; font-weight: 700; margin-top: 4px; }
.town-grid { width: 100%; max-width: 380px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.town-btn { position: relative; border: 1.5px solid var(--gold-dim); background: rgba(212,175,55,.06); color: var(--gold-bright); border-radius: 12px; padding: 16px 10px; font-family:'Noto Serif TC',serif; font-size: 20px; font-weight: 700; letter-spacing: 2px; cursor: pointer; transition: transform .1s, background .15s, border-color .15s; }
.town-btn:active { transform: scale(.96); }
.town-btn.selected { background: rgba(245,166,35,.18); border-color: var(--gold-bright); box-shadow: 0 0 16px rgba(245,166,35,.25); }
.town-btn.taken { opacity: .4; }
.town-btn .taken-tag { display: none; position: absolute; top: 5px; right: 7px; font-family:'Noto Sans TC'; font-size: 10px; letter-spacing: 1px; color: var(--up); font-weight: 700; }
.town-btn.taken .taken-tag { display: block; }
#name-input { width: 100%; max-width: 380px; background: rgba(212,175,55,.06); border: 1.5px solid var(--gold-dim); border-radius: 12px; padding: 14px 16px; font-size: 18px; font-weight: 700; color: var(--ink); text-align: center; outline: none; transition: border-color .15s, box-shadow .15s; }
#name-input:focus { border-color: var(--gold-bright); box-shadow: 0 0 0 3px rgba(245,166,35,.18); }
#name-input::placeholder { color: var(--muted); font-weight: 400; font-size: 15px; }
#join-btn { width: 100%; max-width: 380px; background: linear-gradient(160deg,#ffd96b,#f5a623 55%,#c0390f); color: #3a1900; border: none; border-radius: 12px; padding: 16px; font-family:'Noto Serif TC',serif; font-size: 18px; font-weight: 800; letter-spacing: 3px; cursor: pointer; transition: transform .1s, filter .15s; }
#join-btn:active { transform: scale(.97); filter: brightness(1.08); }
#join-error { font-size: 13px; color: #e3897f; font-weight: 600; min-height: 18px; letter-spacing: 1px; }

/* ── 搶答畫面 ── */
#game-screen { display: none; flex-direction: column; align-items: center; justify-content: space-between; height: 100%; }
.top-bar { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--line); }
#change-town { background: rgba(212,175,55,.08); border: 1px solid var(--gold-dim); color: var(--gold-bright); border-radius: 8px; padding: 7px 12px; font-size: 13px; font-weight: 700; letter-spacing: 1px; cursor: pointer; }
#change-town:active { background: rgba(212,175,55,.18); }
#team-badge { font-family:'Noto Serif TC',serif; border: 1px solid var(--gold-dim); background: rgba(212,175,55,.08); border-radius: 8px; padding: 6px 16px; font-size: 16px; font-weight: 700; color: var(--gold-bright); max-width: 50vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#ws-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); transition: background .3s, box-shadow .3s; flex-shrink: 0; }
#ws-dot.connected { background: var(--up); box-shadow: 0 0 8px rgba(63,174,107,.7); }

.btn-area { flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; padding: 24px; }
#buzz-btn { width: min(80vw,330px); height: min(80vw,330px); border-radius: 50%; border: none; font-family:'Noto Serif TC',serif; font-size: clamp(36px,10vw,56px); font-weight: 900; letter-spacing: 4px; cursor: not-allowed; transition: transform .08s, background .2s, color .2s, box-shadow .2s; outline: none; }
#buzz-btn.state-locked { background: radial-gradient(circle at 40% 35%, #2a2740, #15131f 65%); color: var(--muted); box-shadow: inset 0 0 0 2px rgba(212,175,55,.18), inset 0 -6px 18px rgba(0,0,0,.5); }
#buzz-btn.state-open { background: radial-gradient(circle at 42% 32%, #ffd96b, #f5a623 45%, #c0390f); color: #3a1900; cursor: pointer; box-shadow: 0 0 0 8px rgba(245,166,35,.16), 0 0 0 22px rgba(245,166,35,.06), 0 22px 60px rgba(232,67,31,.5); animation: fire-pulse 1.3s ease-in-out infinite; }
#buzz-btn.state-open:active { transform: scale(.9); }
#buzz-btn.state-buzzed { background: radial-gradient(circle at 42% 35%, #2a2740, #15131f 65%); color: var(--gold-bright); box-shadow: inset 0 0 0 2px var(--gold), 0 0 30px rgba(245,166,35,.3); font-size: clamp(22px,6vw,34px); letter-spacing: 2px; }
@keyframes fire-pulse {
  0%,100% { box-shadow: 0 0 0 8px rgba(245,166,35,.16), 0 0 0 22px rgba(245,166,35,.06), 0 22px 60px rgba(232,67,31,.5); }
  50% { box-shadow: 0 0 0 14px rgba(245,166,35,.22), 0 0 0 36px rgba(245,166,35,.08), 0 22px 80px rgba(232,67,31,.65); }
}
@keyframes body-flash { 0%{background:#f5a623;} 18%{background:#e8431f;} 100%{background:#0a1430;} }
body.buzz-flash { animation: body-flash .5s ease-out forwards; }
@media (prefers-reduced-motion: reduce) { #buzz-btn.state-open { animation: none; } body.buzz-flash { animation: none; } }

.status-bar { width: 100%; padding: 18px 24px 36px; text-align: center; border-top: 1px solid var(--line); min-height: 82px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
#status-msg { font-size: 16px; font-weight: 600; color: var(--muted); padding: 6px 18px; border-radius: 8px; transition: color .3s, background .3s; }
#status-msg.active { color: var(--gold-bright); background: rgba(245,166,35,.1); }
#phase-label { font-size: 10px; letter-spacing: 3px; font-weight: 700; color: var(--muted); }
</style>
</head>
<body>

<div id="login-screen">
  <svg class="login-emblem" viewBox="0 0 120 150" style="width:64px;height:auto">
    <defs>
      <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5d77a"/><stop offset="1" stop-color="#a67c2e"/></linearGradient>
      <linearGradient id="f1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8431f"/><stop offset=".55" stop-color="#f5a623"/><stop offset="1" stop-color="#fde08a"/></linearGradient>
    </defs>
    <path d="M60 6 L82 46 L60 74 L38 46 Z" fill="url(#f1)"/>
    <path d="M60 28 L72 50 L60 66 L48 50 Z" fill="#fde08a"/>
    <path d="M36 84 Q60 118 84 84 Z" fill="url(#g1)"/>
    <rect x="55" y="110" width="10" height="20" rx="2" fill="url(#g1)"/>
    <ellipse cx="60" cy="110" rx="7" ry="5.5" fill="#f5d77a"/>
    <path d="M42 144 Q60 130 78 144 Z" fill="url(#g1)"/>
  </svg>
  <div style="text-align:center; display:flex; flex-direction:column; align-items:center; gap:6px">
    <div class="login-title serif">聖火之夜</div>
    <div class="login-sub">點燃聖火 · 照亮長夜</div>
  </div>
  <div class="pick-label">選擇你的城鎮</div>
  <div id="town-grid" class="town-grid"></div>
  <input id="name-input" type="text" placeholder="可自訂隊名（10 字內，中英文皆可）"
    autocomplete="off" autocorrect="off" spellcheck="false">
  <button id="join-btn">加入</button>
  <div id="join-error"></div>
</div>

<div id="game-screen">
  <div class="top-bar">
    <button id="change-town">換城鎮</button>
    <span id="team-badge">—</span>
    <div id="ws-dot"></div>
  </div>
  <div class="btn-area">
    <button id="buzz-btn" class="state-locked" disabled>BUZZ</button>
  </div>
  <div class="status-bar">
    <div id="status-msg" aria-live="polite" aria-atomic="true">等待主持人點燃聖火</div>
    <span id="phase-label">LOCKED</span>
  </div>
</div>

<script>
// ── 城鎮設定：10 城鎮（要增減就改這個陣列即可）──
const TOWNS = ['城鎮一','城鎮二','城鎮三','城鎮四','城鎮五','城鎮六','城鎮七','城鎮八','城鎮九','城鎮十'];
const MAX_NAME = 10;

const WS_URL = `${location.protocol==='https:'?'wss':'ws'}://${location.host}`;
let ws, myTeam = null, buzzed = false, joinedTeams = [];

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
const $ = id => document.getElementById(id);

// 與 server cleanTeam 一致的前端清理（防 injection + 限 10 字）
function cleanName(raw){
  const s = (raw||'').replace(/[\x00-\x1f\x7f<>]/g,'').trim();
  return [...s].slice(0, MAX_NAME).join('');
}

// 建立城鎮按鈕（點一下填入名稱輸入框，可再自訂）
function buildTownGrid(){
  const grid = $('town-grid');
  grid.innerHTML = '';
  TOWNS.forEach(name=>{
    const b = document.createElement('button');
    b.className = 'town-btn';
    b.dataset.town = name;
    b.innerHTML = `${name}<span class="taken-tag">已加入</span>`;
    b.addEventListener('click', ()=>{
      $('name-input').value = name;
      document.querySelectorAll('.town-btn').forEach(x=>x.classList.remove('selected'));
      b.classList.add('selected');
      $('join-error').textContent = '';
    });
    grid.appendChild(b);
  });
}
function refreshTownGrid(){
  document.querySelectorAll('.town-btn').forEach(b=>{
    b.classList.toggle('taken', joinedTeams.includes(b.dataset.town) && b.dataset.town !== myTeam);
  });
}

// 限制輸入 10 字（含中英文，以字元數計）
$('name-input').addEventListener('input', e=>{
  const cleaned = cleanName(e.target.value);
  if(cleaned !== e.target.value) e.target.value = cleaned;
});
$('name-input').addEventListener('keydown', e=>{ if(e.key==='Enter') doJoin(); });
$('join-btn').addEventListener('click', doJoin);

function doJoin(){
  const name = cleanName($('name-input').value);
  if(!name){ $('join-error').textContent = '請選一個城鎮或輸入隊名（1–10 字）'; return; }
  $('join-error').textContent = '';
  if(ws && ws.readyState===1) ws.send(JSON.stringify({ type:'join', team:name }));
}

function showSelection(){
  myTeam = null; buzzed = false;
  $('game-screen').style.display = 'none';
  $('login-screen').style.display = 'flex';
  document.querySelectorAll('.town-btn').forEach(x=>x.classList.remove('selected'));
  refreshTownGrid();
}

$('change-town').addEventListener('click', ()=>{
  if(ws && ws.readyState===1) ws.send(JSON.stringify({ type:'leave' }));
  showSelection();
});

function connectWS(){
  ws = new WebSocket(WS_URL);
  ws.addEventListener('open', ()=>{
    $('ws-dot').classList.add('connected');
    if(myTeam) ws.send(JSON.stringify({ type:'join', team:myTeam }));
  });
  ws.addEventListener('message', e=>handleMessage(JSON.parse(e.data)));
  ws.addEventListener('close', ()=>{ $('ws-dot').classList.remove('connected'); setTimeout(connectWS,2000); });
}

function handleMessage(msg){
  switch(msg.type){
    case 'state':
      joinedTeams = msg.joinedTeams || [];
      if(!myTeam) refreshTownGrid();
      else applyState(msg);
      break;
    case 'join_ok':
      myTeam = msg.team;
      $('team-badge').textContent = myTeam;
      $('login-screen').style.display = 'none';
      $('game-screen').style.display = 'flex';
      break;
    case 'join_error':
      $('join-error').textContent = msg.reason==='duplicate'
        ? '這個名稱已被使用，請換一個'
        : '名稱不合法，請輸入 1–10 字';
      break;
    case 'force_reselect':
      showSelection();
      break;
    case 'first_buzz':
    case 'buzz_registered':
      if(msg.team===myTeam) setBuzzLocked(msg.rank);
      break;
  }
}

function applyState(msg){
  const btn = $('buzz-btn');
  if(msg.phase==='locked'){
    buzzed=false; btn.disabled=true; btn.className='state-locked'; btn.textContent='BUZZ';
    setStatus('等待主持人點燃聖火', ''); $('phase-label').textContent='LOCKED';
  } else if(msg.phase==='open'){
    if(buzzed) return;
    const myEntry = msg.buzzOrder.find(b=>b.team===myTeam);
    if(myEntry){ setBuzzLocked(msg.buzzOrder.indexOf(myEntry)+1); return; }
    btn.disabled=false; btn.className='state-open'; btn.textContent='搶答';
    setStatus('聖火開放中！', 'active'); $('phase-label').textContent='OPEN';
  }
}

function setBuzzLocked(rank){
  buzzed=true;
  const btn=$('buzz-btn');
  btn.disabled=true; btn.className='state-buzzed'; btn.textContent=`第 ${rank} 名`;
  setStatus('已點燃聖火，等待驗證', 'active'); $('phase-label').textContent=`RANK ${rank}`;
  document.body.classList.add('buzz-flash');
  setTimeout(()=>document.body.classList.remove('buzz-flash'),500);
}

function setStatus(text, cls){ const el=$('status-msg'); el.textContent=text; el.className=cls; }

$('buzz-btn').addEventListener('click', ()=>{
  if(buzzed || !ws || ws.readyState!==1 || !myTeam) return;
  buzzed=true;
  ws.send(JSON.stringify({ type:'buzz', team:myTeam, ts:Date.now() }));
  if(navigator.vibrate) navigator.vibrate([100,50,100]);
});

buildTownGrid();
connectWS();
</script>
</body>
</html>
