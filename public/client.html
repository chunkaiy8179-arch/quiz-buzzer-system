<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>搶答燈 — 學員端</title>
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#0b0e11; --surface:#1e2329; --surface2:#2b3139;
  --primary:#fcd535; --primary-active:#f0b90b; --on-primary:#181a20;
  --body:#eaecef; --muted:#707a8a; --muted-strong:#929aa5;
  --hairline:#2b3139; --up:#0ecb81; --down:#f6465d;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%; overflow: hidden;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--canvas); color: var(--body);
  -webkit-tap-highlight-color: transparent; user-select: none;
  -webkit-font-smoothing: antialiased;
}

/* ── Login ── */
#login-screen {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 22px; height: 100%; padding: 40px 28px;
}
.login-logo {
  width: 88px; height: 88px; border-radius: 22px;
  background: var(--primary);
  display: flex; align-items: center; justify-content: center;
  font-size: 30px; font-weight: 900; color: var(--on-primary); letter-spacing: -1px;
  box-shadow: 0 10px 36px rgba(252,213,53,0.28);
}
.login-title { font-size: 24px; font-weight: 800; letter-spacing: 3px; color: #fff; text-align: center; }
.login-sub { font-size: 11px; color: var(--muted); letter-spacing: 4px; margin-top: -12px; text-transform: uppercase; }

#team-input {
  width: 100%; max-width: 320px;
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: 8px; padding: 16px 18px;
  font-size: 20px; font-weight: 600; color: #fff; text-align: center; outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
#team-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(252,213,53,0.18); }
#team-input::placeholder { color: var(--muted); font-weight: 400; font-size: 16px; }

#join-btn {
  width: 100%; max-width: 320px;
  background: var(--primary); color: var(--on-primary);
  border: none; border-radius: 8px; padding: 18px;
  font-size: 17px; font-weight: 800; letter-spacing: 2px; cursor: pointer;
  transition: transform 0.1s, background 0.15s;
}
#join-btn:active { transform: scale(0.97); background: var(--primary-active); }

/* ── Game ── */
#game-screen { display: none; flex-direction: column; align-items: center; justify-content: space-between; height: 100%; }
.top-bar { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--hairline); }
.top-bar-title { font-size: 11px; font-weight: 700; letter-spacing: 4px; color: var(--muted); text-transform: uppercase; }
#team-badge { background: var(--surface); border: 1px solid var(--hairline); border-radius: 8px; padding: 6px 14px; font-size: 15px; font-weight: 700; color: #fff; }
#ws-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); transition: background 0.3s, box-shadow 0.3s; }
#ws-dot.connected { background: var(--up); box-shadow: 0 0 8px rgba(14,203,129,0.7); }

.btn-area { flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; padding: 24px; }
#buzz-btn {
  width: min(80vw, 330px); height: min(80vw, 330px); border-radius: 50%; border: none;
  font-size: clamp(34px, 9vw, 52px); font-weight: 900; letter-spacing: 4px;
  cursor: not-allowed; transition: transform 0.08s, background 0.2s, color 0.2s, box-shadow 0.2s; outline: none;
}
/* Locked */
#buzz-btn.state-locked { background: var(--surface); color: var(--muted); box-shadow: inset 0 0 0 1px var(--hairline); }
/* Open — yellow primary (the action) */
#buzz-btn.state-open {
  background: var(--primary); color: var(--on-primary); cursor: pointer;
  box-shadow: 0 0 0 8px rgba(252,213,53,0.14), 0 0 0 20px rgba(252,213,53,0.06), 0 20px 60px rgba(252,213,53,0.4);
  animation: buzz-pulse 1.3s ease-in-out infinite;
}
#buzz-btn.state-open:active { transform: scale(0.9); background: var(--primary-active); }
/* Buzzed — locked-in */
#buzz-btn.state-buzzed {
  background: var(--surface2); color: var(--primary);
  box-shadow: inset 0 0 0 2px var(--primary), 0 14px 40px rgba(0,0,0,0.4);
  font-size: clamp(22px, 6vw, 34px); letter-spacing: 1px;
}
@keyframes buzz-pulse {
  0%,100% { box-shadow: 0 0 0 8px rgba(252,213,53,0.14), 0 0 0 20px rgba(252,213,53,0.06), 0 20px 60px rgba(252,213,53,0.4); }
  50% { box-shadow: 0 0 0 14px rgba(252,213,53,0.2), 0 0 0 34px rgba(252,213,53,0.08), 0 20px 80px rgba(252,213,53,0.55); }
}
@keyframes body-flash { 0%{background:#fff;} 18%{background:var(--primary);} 100%{background:var(--canvas);} }
body.buzz-flash { animation: body-flash 0.5s ease-out forwards; }
@media (prefers-reduced-motion: reduce) { #buzz-btn.state-open { animation: none; } body.buzz-flash { animation: none; } }

.status-bar { width: 100%; padding: 18px 24px 36px; text-align: center; border-top: 1px solid var(--hairline); min-height: 82px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
#status-msg { font-size: 16px; font-weight: 600; color: var(--muted); padding: 6px 18px; border-radius: 8px; transition: color 0.3s, background 0.3s; }
#status-msg.active { color: var(--primary); background: rgba(252,213,53,0.1); }
#phase-label { font-size: 10px; letter-spacing: 3px; font-weight: 700; color: var(--muted); text-transform: uppercase; }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-logo">BZ</div>
  <div style="text-align:center">
    <div class="login-title">搶答燈系統</div>
    <div class="login-sub">Quiz Buzzer System</div>
  </div>
  <input id="team-input" type="text" placeholder="輸入組別名稱" maxlength="20" autocomplete="off" autocorrect="off" spellcheck="false">
  <button id="join-btn">加入搶答</button>
</div>

<div id="game-screen">
  <div class="top-bar">
    <span class="top-bar-title">搶答燈</span>
    <span id="team-badge">—</span>
    <div id="ws-dot"></div>
  </div>
  <div class="btn-area">
    <button id="buzz-btn" class="state-locked" disabled>BUZZ</button>
  </div>
  <div class="status-bar">
    <div id="status-msg" aria-live="polite" aria-atomic="true">等待主持人開放搶答</div>
    <span id="phase-label">LOCKED</span>
  </div>
</div>

<script>
const WS_URL = `${location.protocol==='https:'?'wss':'ws'}://${location.host}`;
let ws, myTeam, buzzed = false;

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
const $ = id => document.getElementById(id);

$('join-btn').addEventListener('click', joinGame);
$('team-input').addEventListener('keydown', e => { if(e.key==='Enter') joinGame(); });

function joinGame(){
  const name = $('team-input').value.trim();
  if(!name){ $('team-input').focus(); return; }
  myTeam = name;
  connectWS();
}

function connectWS(){
  ws = new WebSocket(WS_URL);
  ws.addEventListener('open', ()=>{
    ws.send(JSON.stringify({ type:'join', team:myTeam }));
    $('login-screen').style.display='none';
    $('game-screen').style.display='flex';
    $('team-badge').textContent=myTeam;
    $('ws-dot').classList.add('connected');
  });
  ws.addEventListener('message', e=>handleMessage(JSON.parse(e.data)));
  ws.addEventListener('close', ()=>{ $('ws-dot').classList.remove('connected'); setTimeout(connectWS,2000); });
}

function handleMessage(msg){
  switch(msg.type){
    case 'state': applyState(msg); break;
    case 'first_buzz':
    case 'buzz_registered':
      if(msg.team===myTeam) setBuzzLocked(msg.rank);
      break;
  }
}

function applyState(msg){
  const btn = $('buzz-btn');
  if(msg.phase==='locked'){
    buzzed=false; btn.disabled=true; btn.className='state-locked'; btn.textContent='BUZZ';
    setStatus('等待主持人開放搶答', ''); $('phase-label').textContent='LOCKED';
  } else if(msg.phase==='open'){
    if(buzzed) return;
    const myEntry = msg.buzzOrder.find(b=>b.team===myTeam);
    if(myEntry){ setBuzzLocked(msg.buzzOrder.indexOf(myEntry)+1); return; }
    btn.disabled=false; btn.className='state-open'; btn.textContent='BUZZ';
    setStatus('搶答開放中！', 'active'); $('phase-label').textContent='OPEN';
  }
}

function setBuzzLocked(rank){
  buzzed=true;
  const btn=$('buzz-btn');
  btn.disabled=true; btn.className='state-buzzed'; btn.textContent=`第 ${rank} 名`;
  setStatus('已搶答，等待驗證', 'active'); $('phase-label').textContent=`RANK ${rank}`;
  document.body.classList.add('buzz-flash');
  setTimeout(()=>document.body.classList.remove('buzz-flash'),500);
}

function setStatus(text, cls){ const el=$('status-msg'); el.textContent=text; el.className=cls; }

$('buzz-btn').addEventListener('click', ()=>{
  if(buzzed || !ws || ws.readyState!==1) return;
  buzzed=true;
  ws.send(JSON.stringify({ type:'buzz', team:myTeam, ts:Date.now() }));
  if(navigator.vibrate) navigator.vibrate([100,50,100]);
});
</script>
</body>
</html>
